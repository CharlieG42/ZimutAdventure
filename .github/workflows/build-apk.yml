name: Build APK (Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7-stable"
  GODOT_RELEASE: "4.7"
  EXPORT_PRESET: "Android"
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  cleanup-artifacts:
    name: Purge artefacts APK (garde les 2 plus récents par type)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Supprime les artefacts APK au-delà des 2 plus récents par type
        run: |
          set -e
          KEEP=2
          for type in debug release; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq ".artifacts | map(select(.name == \"ZimutAdventure-android-$type\")) | sort_by(.created_at) | reverse" > /tmp/all_$type.json
            total=$(jq length /tmp/all_$type.json)
            if [ "$total" -le "$KEEP" ]; then
              echo "$type: $total artefact(s), rien à supprimer (garde $KEEP)"
              continue
            fi
            jq -r --argjson keep "$KEEP" '.[$keep:] | .[].id' /tmp/all_$type.json | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" > /dev/null
              echo "supprimé: $type #$id"
            done
          done
          echo "--- après purge ---"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | {name, created_at, size_mb: (.size_in_bytes/1048576|floor)}]' || true

      - name: Purge TOUS les artefacts APK si le quota est atteint
        run: |
          set -e
          echo "Vérification du quota de stockage..."
          remaining=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | length')
          total_mb=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[].size_in_bytes] | (add // 0) / 1048576 | floor')
          echo "Artefacts restants: $remaining ($total_mb Mo)"
          if [ "$total_mb" -lt 100 ]; then
            echo "Quota probablement OK, pas de purge complète nécessaire"
            exit 0
          fi
          echo "Quota probablement atteint, suppression de TOUS les artefacts APK..."
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("ZimutAdventure-android-")) | .id' | while read -r id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" > /dev/null
            echo "supprimé (purge complète): #$id"
          done
          echo "Purge complète terminée" 

  storage-report:
    name: Rapport stockage artefacts
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Affiche l'usage du stockage des artefacts
        run: |
          set -e
          if ! command -v gh > /dev/null; then
            echo "gh CLI indisponible, rapport ignoré"
            exit 0
          fi
          echo "## Usage du stockage des artefacts"
          echo ""
          echo "| Artefact | Créé | Taille | Retention |"
          echo "|----------|------|---------|-----------|"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.name, .created_at, ((.size_in_bytes/1048576*100|floor)/100|tostring) + " Mo", (.expired|if . then "expiré" else "actif" end)] | @tsv' \
            | while IFS=$'\t' read -r name created size expired; do
                echo "| $name | $created | $size | $expired |"
              done
          total=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[].size_in_bytes] | (add // 0) / 1048576 | floor')
          echo ""
          echo "**Total actuel : ${total} Mo**"
          echo ""
          echo "> Rappel : le quota de stockage Actions est recalculé toutes les 6–12 h ; les suppressions ne libèrent l'espace qu'après ce délai."

  test:
    name: Tests (Godot headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run headless tests
        run: sh tests/run_all.sh godot

  build-apk:
    name: Build APK (${{ matrix.build_type }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -eu
          SDK_ROOT="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          curl -fSL --retry 5 --retry-delay 10 --retry-all-errors -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm -f cmdline-tools.zip
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK_ROOT" --licenses > /dev/null
          for attempt in 1 2 3; do
            echo "Tentative d'installation du SDK #$attempt..."
            if cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK_ROOT" \
              "platform-tools" \
              "build-tools;36.1.0" \
              "platforms;android-36" \
              "cmake;3.10.2.4988404" \
              "ndk;29.0.14206865"; then
              echo "SDK installé avec succès"
              exit 0
            fi
            echo "Tentative #$attempt échouée, nouvelle tentative dans 15s..."
            sleep 15
          done
          echo "::error::Échec de l'installation du SDK après 3 tentatives"
          exit 1

      - name: Setup Godot + export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: true

      - name: Configure Godot Android toolchain paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Restore release keystore (release only, when secrets are set)
        if: matrix.build_type == 'release' && env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_KEYSTORE_PASSWORD != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /home/runner/work/release.keystore
          chmod 600 /home/runner/work/release.keystore
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/home/runner/work/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=zimut"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate throwaway keystore when secrets are missing (PR without access)
        if: matrix.build_type == 'release' && (env.RELEASE_KEYSTORE_BASE64 == '' || env.RELEASE_KEYSTORE_PASSWORD == '')
        run: |
          echo "Release signing secrets not available (e.g. on a PR): generating a throwaway keystore so the release APK is still signed and installable."
          keytool -genkeypair \
            -keystore /home/runner/work/throwaway-release.keystore \
            -alias zimut \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass throwaway -keypass throwaway \
            -dname "CN=ZimutAdventure Throwaway, OU=CI, O=CharlieG42, C=FR"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/home/runner/work/throwaway-release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=zimut"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=throwaway"
          } >> "$GITHUB_ENV"
          sed -i 's|^keystore/release=.*|keystore/release=""|; s|^keystore/release_user=.*|keystore/release_user=""|; s|^keystore/release_password=.*|keystore/release_password=""|' export_presets.cfg
          grep '^keystore/release' export_presets.cfg || true

      - name: Import project
        run: godot --headless --path . --import

      - name: Install Android build template (Gradle build)
        run: |
          set -eu
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p android/build
          unzip -q -o "$TEMPLATES_DIR/android_source.zip" -d android/build
          echo "rootProject.name = \"GodotAndroid\"" >> android/build/settings.gradle
          printf '%s' "4.7.stable" > android/.build_version
          touch android/build/.gdignore
          ls android/build

      - name: Export APK (${{ matrix.build_type }})
        run: |
          mkdir -p build/android
          if [ "${{ matrix.build_type }}" = "debug" ]; then
            godot --headless --path . --export-debug "$EXPORT_PRESET" "build/android/ZimutAdventure-debug.apk"
          else
            godot --headless --path . --export-release "$EXPORT_PRESET" "build/android/ZimutAdventure-release.apk"
          fi

      - name: Verify APK signature
        run: |
          APK="build/android/ZimutAdventure-${{ matrix.build_type }}.apk"
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZimutAdventure-android-${{ matrix.build_type }}
          path: build/android/ZimutAdventure-${{ matrix.build_type }}.apk
          retention-days: 1

      - name: Attach APK to tag release (release only, on tags)
        if: matrix.build_type == 'release' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/ZimutAdventure-release.apk

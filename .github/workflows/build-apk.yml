name: Build APK (Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7-stable"
  GODOT_RELEASE: "4.7"
  EXPORT_PRESET: "Android"
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  test:
    name: Tests (Godot headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run headless tests
        run: sh tests/run_all.sh godot

  build-apk:
    name: Build APK (${{ matrix.build_type }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
    env:
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/work/release.keystore
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: zimut
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -eu
          SDK_ROOT="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          curl -fSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm -f cmdline-tools.zip
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK_ROOT" --licenses > /dev/null
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;36.1.0" \
            "platforms;android-36" \
            "cmake;3.10.2.4988404" \
            "ndk;29.0.14206865"

      - name: Setup Godot + export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: true

      - name: Configure Godot Android toolchain paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

      - name: Restore release keystore (release only)
        if: matrix.build_type == 'release'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          chmod 600 "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"

      - name: Import project
        run: godot --headless --path . --import

      - name: Install Android build template (Gradle build)
        run: |
          set -eu
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p .android
          unzip -q -o "$TEMPLATES_DIR/android_source.zip" -d .android
          echo "rootProject.name = \"GodotAndroid\"" >> .android/settings.gradle

      - name: Export APK (${{ matrix.build_type }})
        run: |
          mkdir -p build/android
          if [ "${{ matrix.build_type }}" = "debug" ]; then
            godot --headless --path . --export-debug "$EXPORT_PRESET" "build/android/ZimutAdventure-debug.apk"
          else
            godot --headless --path . --export-release "$EXPORT_PRESET" "build/android/ZimutAdventure-release.apk"
          fi

      - name: Verify APK signature
        run: |
          APK="build/android/ZimutAdventure-${{ matrix.build_type }}.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --print-certs "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZimutAdventure-android-${{ matrix.build_type }}
          path: build/android/ZimutAdventure-${{ matrix.build_type }}.apk
          retention-days: 30

      - name: Attach APK to tag release (release only, on tags)
        if: matrix.build_type == 'release' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/ZimutAdventure-release.apk
